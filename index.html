<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت من</title>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: white;
            color: #764ba2;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 20px;
        }
        button:hover {
            transform: scale(1.1);
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>سلام سابر! 👋</h1>
    <p>این اولین وب‌سایت منه که با همکاری DeepSeek ساختم.</p>
    <button onclick="alert('تو یک برنامه‌نویس واقعی هستی! 🚀')">روی من کلیک کن!</button>
</body>
</html>
